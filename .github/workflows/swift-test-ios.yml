name: Swift Package iOS 16 CI

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  test-ios16:
    runs-on: macos-14 # Uses Xcode 15/16 environments

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Download and install the iOS 16 Simulator Runtime dynamically
      - name: Install iOS 16 Runtime
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer && xcodebuild -downloadPlatform iOS -buildVersion 16.4

      # 2. Boot the simulator and run your package tests
      - name: Run Tests on iOS 16
        run: |
          xcodebuild test \
            -scheme "VeinFilter-Package" \
            -destination "platform=iOS Simulator,name=iPhone 14,OS=16.4" \
            -quiet