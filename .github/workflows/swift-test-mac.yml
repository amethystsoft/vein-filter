name: Swift Test (macOS)

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]
    
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #6.0.2
        with:
          persist-credentials: false
      - name: Test
        run: swift test
